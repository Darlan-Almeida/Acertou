services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acertou
      POSTGRES_USER: acertou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acertou_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acertou"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://acertou:${POSTGRES_PASSWORD:-acertou_local}@db:5432/acertou
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles:
      - public
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
volumes:
  postgres_data:
